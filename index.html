<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="description" content="Support creators directly with UPI. A focused creator-support dashboard and public support page." />
    <meta property="og:title" content="Supportly — UPI creator support" />
    <meta property="og:description" content="Support creators directly with UPI. No bank details required." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.example/@ritam" />
    <meta name="twitter:card" content="summary" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='10' fill='%235c5ce2'/%3E%3Cpath d='M9 16.5 13.2 21 23 10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="styles.css" />
    <title>Supportly — UPI creator support</title>
  </head>
  <body>
    <!-- Inline icon sprite keeps the static build dependency-free. -->
    <svg class="svg-sprite" aria-hidden="true" focusable="false">
      <defs>
        <symbol id="icon-home" viewBox="0 0 24 24"><path d="M3.5 10.8 12 3.6l8.5 7.2v8.1a1.6 1.6 0 0 1-1.6 1.6H5.1a1.6 1.6 0 0 1-1.6-1.6v-8.1Z"/><path d="M9.2 20.5v-5.8h5.6v5.8"/></symbol>
        <symbol id="icon-wallet" viewBox="0 0 24 24"><path d="M4.4 6.4h13.5a2 2 0 0 1 2 2v9.2a2 2 0 0 1-2 2H5.1a2.1 2.1 0 0 1-2.1-2.1V6.7A2.7 2.7 0 0 1 5.7 4h10.9a1.3 1.3 0 0 1 0 2.6H4.4"/><path d="M16.4 13h3.8"/><circle cx="16.2" cy="13" r=".7" fill="currentColor" stroke="none"/></symbol>
        <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 19.5V4.5M4 19.5h16"/><path d="m7 15 3.2-3.6 3 2 4.8-6"/><path d="M18 7.4h-3.5M18 7.4v3.5"/></symbol>
        <symbol id="icon-settings" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z"/><path d="m19.4 13.5 1.1.8-1.7 2.9-1.3-.5a7.8 7.8 0 0 1-1.7 1l-.2 1.4h-3.4l-.2-1.4a7.8 7.8 0 0 1-1.7-1l-1.3.5-1.7-2.9 1.1-.8a7 7 0 0 1 0-2.1l-1.1-.8 1.7-2.9 1.3.5a7.8 7.8 0 0 1 1.7-1l.2-1.4h3.4l.2 1.4a7.8 7.8 0 0 1 1.7 1l1.3-.5 1.7 2.9-1.1.8a7 7 0 0 1 0 2.1Z"/></symbol>
        <symbol id="icon-external" viewBox="0 0 24 24"><path d="M13 5h6v6M19 5l-8.5 8.5"/><path d="M18 13.5v4.1a1.4 1.4 0 0 1-1.4 1.4H6.4A1.4 1.4 0 0 1 5 17.6V7.4A1.4 1.4 0 0 1 6.4 6h4.1"/></symbol>
        <symbol id="icon-share" viewBox="0 0 24 24"><circle cx="18" cy="5.5" r="2.3"/><circle cx="6" cy="12" r="2.3"/><circle cx="18" cy="18.5" r="2.3"/><path d="m8.1 10.9 7.7-4.2M8.1 13.1l7.7 4.2"/></symbol>
        <symbol id="icon-arrow-up" viewBox="0 0 24 24"><path d="M5 16 12 9l7 7"/></symbol>
        <symbol id="icon-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
        <symbol id="icon-arrow-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12.5 4.2 4.2L19 7"/></symbol>
        <symbol id="icon-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m8.5 12 2.2 2.2 4.9-5"/></symbol>
        <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.3 2"/></symbol>
        <symbol id="icon-flag" viewBox="0 0 24 24"><path d="M6 20V4m0 1h10l-1.5 3L16 11H6"/></symbol>
        <symbol id="icon-users" viewBox="0 0 24 24"><circle cx="9" cy="9" r="3"/><path d="M3.8 19a5.2 5.2 0 0 1 10.4 0M16 6.8a2.8 2.8 0 0 1 0 5.4M16.2 14.7a4.3 4.3 0 0 1 4 4.3"/></symbol>
        <symbol id="icon-eye" viewBox="0 0 24 24"><path d="M3.4 12s3.2-5 8.6-5 8.6 5 8.6 5-3.2 5-8.6 5-8.6-5-8.6-5Z"/><circle cx="12" cy="12" r="2.2"/></symbol>
        <symbol id="icon-youtube" viewBox="0 0 24 24"><path d="M20.4 7.2a2.4 2.4 0 0 0-1.7-1.7C17.2 5 12 5 12 5s-5.2 0-6.7.5a2.4 2.4 0 0 0-1.7 1.7C3.1 8.7 3.1 12 3.1 12s0 3.3.5 4.8a2.4 2.4 0 0 0 1.7 1.7c1.5.5 6.7.5 6.7.5s5.2 0 6.7-.5a2.4 2.4 0 0 0 1.7-1.7c.5-1.5.5-4.8.5-4.8s0-3.3-.5-4.8Z"/><path d="m10.2 15.1 4.2-3.1-4.2-3.1v6.2Z" fill="currentColor" stroke="none"/></symbol>
        <symbol id="icon-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="11" height="12" rx="1.7"/><path d="M16 8V5.8A1.8 1.8 0 0 0 14.2 4H5.8A1.8 1.8 0 0 0 4 5.8v9.4A1.8 1.8 0 0 0 5.8 17H8"/></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.2"/><path d="m15.5 15.5 4.3 4.3"/></symbol>
        <symbol id="icon-bell" viewBox="0 0 24 24"><path d="M6.1 16.8h11.8l-1.3-1.9V10a4.6 4.6 0 0 0-9.2 0v4.9l-1.3 1.9Z"/><path d="M10 19.3a2.2 2.2 0 0 0 4 0"/></symbol>
        <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
        <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="icon-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.2" fill="currentColor" stroke="none"/></symbol>
        <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7.7a4 4 0 0 1 8 0V10M12 14v2"/></symbol>
        <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 3.7 19 6v5.4c0 4.3-2.8 7.8-7 9-4.2-1.2-7-4.7-7-9V6l7-2.3Z"/><path d="m8.7 12 2.1 2.1 4.5-4.5"/></symbol>
        <symbol id="icon-qr" viewBox="0 0 24 24"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2M18 14h2v2M14 18h2v2M18 18h2"/></symbol>
        <symbol id="icon-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.7 9.2a2.5 2.5 0 1 1 4.2 1.8c-1.2 1.1-1.9 1.4-1.9 2.7M12 16.9h.01"/></symbol>
        <symbol id="icon-file" viewBox="0 0 24 24"><path d="M6.5 3.8h7l4 4v12.4H6.5z"/><path d="M13.5 3.8v4h4M9 12h6M9 15.5h6"/></symbol>
        <symbol id="icon-log-out" viewBox="0 0 24 24"><path d="M10 5H6.5A1.5 1.5 0 0 0 5 6.5v11A1.5 1.5 0 0 0 6.5 19H10M14 16l4-4-4-4M18 12H9"/></symbol>
        <symbol id="icon-spark" viewBox="0 0 24 24"><path d="m12 3 1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3ZM19 15l.7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7L19 15Z"/></symbol>
      </defs>
    </svg>

    <div id="app" class="app-root">
      <div class="demo-banner">
        <span class="demo-dot"></span>
        <span><strong>Preview mode</strong> — this interface is a static product prototype. No real payments are processed.</span>
        <button class="banner-link" data-action="open-demo-note">How this works <span aria-hidden="true">→</span></button>
      </div>

      <div class="app-shell">
        <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
          <div class="brand-lockup">
            <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></div>
            <div>
              <div class="brand-name">supportly</div>
              <div class="brand-caption">creator support</div>
            </div>
          </div>

          <div class="sidebar-profile">
            <div class="avatar avatar-sm avatar-purple">RP</div>
            <div class="profile-copy">
              <strong>Ritam Paine</strong>
              <span>@ritam</span>
            </div>
            <button class="icon-button icon-button-sm" aria-label="Account menu" data-action="account-menu"><svg class="icon"><use href="#icon-more"></use></svg></button>
          </div>

          <div class="sidebar-section-label">Workspace</div>
          <nav class="side-nav" id="side-nav">
            <button class="nav-item is-active" data-view="overview"><svg class="icon"><use href="#icon-home"></use></svg><span>Overview</span></button>
            <button class="nav-item" data-view="payments"><svg class="icon"><use href="#icon-wallet"></use></svg><span>Payments</span><span class="nav-count">8</span></button>
            <button class="nav-item" data-view="analytics"><svg class="icon"><use href="#icon-chart"></use></svg><span>Analytics</span></button>
            <button class="nav-item" data-view="settings"><svg class="icon"><use href="#icon-settings"></use></svg><span>Settings</span></button>
          </nav>

          <div class="sidebar-section-label sidebar-section-label-spaced">Your page</div>
          <nav class="side-nav">
            <button class="nav-item nav-item-page" data-view="public"><span class="page-live-dot"></span><span>Public page</span><svg class="icon nav-external"><use href="#icon-external"></use></svg></button>
          </nav>

          <div class="sidebar-spacer"></div>
          <div class="sidebar-help-card">
            <div class="help-icon"><svg class="icon"><use href="#icon-help"></use></svg></div>
            <div><strong>Need a hand?</strong><span>Read the getting started guide.</span></div>
            <button class="text-button" data-action="open-guide">Open guide <svg class="icon icon-xs"><use href="#icon-arrow-right"></use></svg></button>
          </div>
          <button class="sidebar-logout" data-action="logout"><svg class="icon"><use href="#icon-log-out"></use></svg><span>Sign out</span></button>
        </aside>

        <div class="sidebar-scrim" id="sidebar-scrim" data-action="close-sidebar"></div>

        <main class="main-content">
          <header class="topbar">
            <button class="mobile-menu-button icon-button" aria-label="Open navigation" data-action="open-sidebar"><svg class="icon"><use href="#icon-menu"></use></svg></button>
            <div class="breadcrumbs" id="breadcrumbs"><span>Workspace</span><span class="breadcrumb-slash">/</span><strong>Overview</strong></div>
            <div class="topbar-actions">
              <label class="search-box" aria-label="Search">
                <svg class="icon"><use href="#icon-search"></use></svg>
                <input type="search" placeholder="Search" data-action="search" />
                <kbd>⌘ K</kbd>
              </label>
              <button class="icon-button notification-button" aria-label="Notifications" data-action="notifications"><svg class="icon"><use href="#icon-bell"></use></svg><span class="notification-dot"></span></button>
              <div class="topbar-avatar avatar avatar-sm avatar-purple">RP</div>
            </div>
          </header>

          <div id="page-view" class="page-view" aria-live="polite"></div>
        </main>
      </div>

      <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
        <button class="mobile-nav-item is-active" data-view="overview"><svg class="icon"><use href="#icon-home"></use></svg><span>Home</span></button>
        <button class="mobile-nav-item" data-view="payments"><svg class="icon"><use href="#icon-wallet"></use></svg><span>Payments</span></button>
        <button class="mobile-nav-item" data-view="public"><span class="mobile-nav-add"><svg class="icon"><use href="#icon-external"></use></svg></span><span>My page</span></button>
        <button class="mobile-nav-item" data-view="analytics"><svg class="icon"><use href="#icon-chart"></use></svg><span>Insights</span></button>
        <button class="mobile-nav-item" data-view="settings"><svg class="icon"><use href="#icon-settings"></use></svg><span>Settings</span></button>
      </nav>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>
    <noscript>
      <div class="noscript-card">Supportly needs JavaScript to render this interactive prototype. Please enable JavaScript and reload.</div>
    </noscript>
    <script src="app.js"></script>
  </body>
</html>
